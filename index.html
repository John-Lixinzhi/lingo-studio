<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  /* 在首屏绘制前应用外观偏好（主题 + 亮度），避免切换时闪一下白底 */
  (function () {
    var el = document.documentElement;
    try {
      var p = JSON.parse(localStorage.getItem('lingo_appearance') || '{}');
      el.dataset.theme = p.theme === 'night' ? 'night' : 'paper';
      el.dataset.lum = /^(soft|normal|bright)$/.test(p.lum) ? p.lum : 'normal';
    } catch (e) {
      el.dataset.theme = 'paper';
      el.dataset.lum = 'normal';
    }
  })();
</script>
<title>Lingo Studio · 多语种沉浸式学习平台</title>
